name: Trigger auto deployment for chatbot-be

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/chatbot-be-AutoDeployTrigger-6d11e971-4440-481b-a514-2dac439bed67.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.CHATBOTBE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CHATBOTBE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CHATBOTBE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.CHATBOTBE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CHATBOTBE_REGISTRY_PASSWORD }}
          containerAppName: chatbot-be
          resourceGroup: pmt-resource-v1
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


